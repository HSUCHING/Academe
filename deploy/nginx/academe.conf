server {
    listen 80;
    server_name academe.metacognix.xyz;

    return 301 https://$host$request_uri;
}

# HTTPS — TLS is terminated by the host Nginx. The application itself is
# reachable only on the loopback interface through Docker Compose.
server {
    listen 443 ssl http2;
    server_name academe.metacognix.xyz;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    # Course imports and uploaded learning media can be large.
    client_max_body_size 10G;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required by the collaboration server under /collab.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }
}
